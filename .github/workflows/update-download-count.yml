name: Update program download count

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count installer downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/update_download_count.py
      - name: Publish changed count
        run: |
          if git diff --quiet -- .github/download-count.json; then
            exit 0
          fi
          git config user.name "CrabbedSquare8"
          git config user.email "CrabbedSquare8@users.noreply.github.com"
          git add .github/download-count.json
          git commit -m "Update program download count"
          git push
